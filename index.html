<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Kosalai — South India's trusted marketplace for buying and selling livestock and pets. Cows, Buffaloes, Goats, Dogs, Cats and more." />
  <meta name="theme-color" content="#1a7a3c" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Preconnect to Supabase: eliminates DNS+TLS handshake latency -->
  <link rel="preconnect" href="https://ulbrlhcelwoojwnvznrd.supabase.co">
  <link rel="dns-prefetch" href="https://ulbrlhcelwoojwnvznrd.supabase.co">
  <!-- Preconnect to Cloudinary for fast image loading -->
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="dns-prefetch" href="https://res.cloudinary.com">
  <!-- Preconnect to Google Analytics -->
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="dns-prefetch" href="https://www.googletagmanager.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kosalai">
  <title>Kosalai — Buy & Sell Animals with Full Trust</title>

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // Only initialize and track if on production domain
    const hostname = window.location.hostname;
    if (hostname === 'kosalai.in' || hostname === 'www.kosalai.in') {
      // Disable automatic page_view so React Router (AnalyticsTracker) handles it
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', { send_page_view: false });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
